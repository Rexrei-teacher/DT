<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Is Class Today?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --ground:#0D1530; --tile:#16204A; --tile-2:#1C2858; --line:#27336A;
  --ink:#F3F5FB; --muted:#8E99C4; --faint:#5E6A9C;
  --now:#F4C34F; --now-ink:#1A1405; --break:#3FB88A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;gap:1.1vh;padding-block:1.4vh;padding-inline:max(16px,1.4vw)}

/* ---------- top bar ---------- */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2vw}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,56px);letter-spacing:.01em}
.brand span{color:var(--muted);font-size:clamp(11px,.95vw,20px);letter-spacing:.14em;text-transform:uppercase;margin-top:.45vh}
.status{display:flex;align-items:center;gap:1.2vw;justify-self:center;flex-wrap:wrap;justify-content:center}
.cycle.off{background:var(--tile-2);color:var(--muted)}
.cycle{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.4vw,52px);background:var(--ink);color:var(--ground);padding:.2vh 1vw;border-radius:6px;letter-spacing:.02em}
.slot{display:flex;flex-direction:column;line-height:1.05}
.slot .k{color:var(--muted);font-size:clamp(11px,.9vw,19px);letter-spacing:.14em;text-transform:uppercase}
.slot .v{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.1vw,46px);font-variant-numeric:tabular-nums}
.chip{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.35vw,30px);letter-spacing:.06em;text-transform:uppercase;padding:.35vh .8vw;border-radius:999px;background:var(--now);color:var(--now-ink)}
.chip.brk{background:var(--break);color:#04160F}
.chip.off{background:var(--tile-2);color:var(--muted)}
.clock{text-align:right;line-height:1}
.clock b{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.6vw,78px);font-variant-numeric:tabular-nums}
.clock span{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:clamp(15px,1.6vw,34px);margin-top:.4vh}
.progress{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--now);transition:width 1s linear}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:minmax(0,4.2vw) repeat(3,minmax(0,1fr));grid-template-rows:auto repeat(7,minmax(0,1fr));gap:.7vh .6vw;min-height:0}
.colh{font-family:var(--display);font-weight:600;color:var(--muted);font-size:clamp(12px,1.1vw,24px);letter-spacing:.2em;text-align:left;padding-left:.9vw}
.grade{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,64px);display:flex;align-items:center;justify-content:center;color:var(--ink);line-height:1}
.grade sup{font-size:.45em;color:var(--muted);margin-left:.05em}
.tile{position:relative;background:var(--tile);border-radius:6px;display:grid;grid-template-columns:.55vw 1fr;overflow:hidden;min-height:0}
.tile .strip{background:var(--c,var(--faint))}
.tile .in{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;column-gap:.9vw;padding:.5vh .8vw;min-width:0;align-items:center}
.sec{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.4vw,30px);color:var(--muted);grid-row:1/3;align-self:center;width:1.4em;text-align:center}
.room{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.55vw,56px);line-height:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{display:flex;gap:.6vw;align-items:baseline;min-width:0;font-size:clamp(11px,.95vw,20px);color:var(--muted);white-space:nowrap}
.meta .subj{color:var(--ink);font-weight:600;letter-spacing:.04em}
.meta .who{overflow:hidden;text-overflow:ellipsis;min-width:0}
.next{position:absolute;right:.6vw;top:.45vh;font-size:clamp(9px,.72vw,15px);color:var(--faint);letter-spacing:.04em;white-space:nowrap}
.next b{color:var(--muted);font-weight:600}
/* electives: several rooms at once */
.opts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:.5vw;grid-row:1/3;min-width:0;align-self:stretch;align-items:center}
.opt{border-left:.35vw solid var(--c);padding-left:.5vw;min-width:0;line-height:1.05}
.opt .r{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.45vw,32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .s{font-size:clamp(9px,.75vw,16px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.pause .in{grid-template-columns:auto 1fr}
.tile.pause .room{color:var(--break)}

/* ---------- footer controls ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;gap:1vw;flex-wrap:wrap;color:var(--faint);font-size:clamp(10px,.8vw,16px)}
.ctrls{display:flex;gap:.4vw;flex-wrap:wrap;align-items:center}
.ctrls button{font:inherit;font-weight:600;color:var(--muted);background:var(--tile);border:1px solid var(--line);border-radius:5px;padding:.3vh .7vw;cursor:pointer}
.ctrls button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ctrls button:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.ctrls .sep{width:1px;height:1.4em;background:var(--line);margin-inline:.3vw}
kbd{font-family:var(--body);border:1px solid var(--line);border-radius:3px;padding:0 .3em;color:var(--muted)}

@media (max-width:760px){
  html,body{height:auto}
  .app{height:auto}
  .bar{grid-template-columns:1fr auto}
  .status{grid-column:1/-1;grid-row:2;justify-self:start}
  .board{grid-template-columns:40px repeat(3,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(84px,auto)}
  .tile .in{grid-template-columns:1fr;padding:6px}
  .sec{display:none}
  .next{display:none}
  .meta{flex-direction:column;gap:0;white-space:normal}
  .opts{--n:1 !important;grid-row:auto}
}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><b>Where is class today?</b><span>Marymount · Grades 6–12</span></div>
    <div class="status">
      <div class="cycle" id="cycle">DAY 1</div>
      <div class="slot"><span class="k" id="slotK">Period</span><span class="v" id="slotV">—</span></div>
      <div class="chip" id="chip">Now</div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  </header>

  <main class="board" id="board" aria-live="polite"></main>

  <footer class="foot">
    <div class="ctrls"><button id="fs">Full screen</button></div>
    <div>Updates automatically with the time · Cycle days from the 2026–2027 school calendar · Schedule generated 09.14.2026</div>
  </footer>
</div>

// Franjas (iguales para 6° a 12°), minutos desde medianoche
const P = [[435,480],[485,525],[530,570],[570,600],[600,640],[645,685],[690,730],[735,775],[775,820],[820,865],[870,915]];
const GRADES = ["6","7","8","9","10","11","12"], SECS = ["A","B","C"];
const fmt = m => { let h=Math.floor(m/60), mm=String(m%60).padStart(2,"0"); const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${mm} ${ap}`; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const long = d => d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const short = d => d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

// Siguiente fecha con clases (Day 1–5) después de "from"
function nextSchoolDay(from){
  const t = new Date(from);
  for (let i=0;i<400;i++){ t.setDate(t.getDate()+1); const d = CAL[ymd(t)]; if (d>=1 && d<=5) return { date:new Date(t), day:d }; }
  return null;
}

/* ---- qué mostrar: siempre según la fecha y la hora del equipo ---- */
function state(now){
  const m = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60, today = CAL[ymd(now)], wd = now.getDay();
  const todayTag = wd===0||wd===6 ? "WEEKEND" : today===0 ? "DAY 0" : today>=1 ? `DAY ${today}` : "NO CLASSES";
  const upcoming = why => { const n = nextSchoolDay(now); return n ? { day:n.day, p:0, mode:"off", why, today:todayTag, date:n.date } : { day:null, mode:"end", label:"School year over" }; };
  if (!(today>=1 && today<=5)) return upcoming(wd===0||wd===6 ? "Weekend" : today===0 ? "No regular classes today" : "No classes today");
  if (m >= P[10][1]) return upcoming("School day over");
  if (m < P[0][0]) return { day:today, p:0, mode:"soon", label:`Starts ${fmt(P[0][0])}` };
  for (let i=0;i<P.length;i++){
    if (m>=P[i][0] && m<P[i][1]) return { day:today, p:i, mode:"now", frac:(m-P[i][0])/(P[i][1]-P[i][0]) };
    if (i+1<P.length && m>=P[i][1] && m<P[i+1][0]) return { day:today, p:i+1, mode:"soon", label:"Class change" };
  }
}

const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function roomOf(c){ return !c ? "" : c.b ? c.b : c.o ? "Electives" : c.r || c.s; }

function tileHTML(sec, c, nx){
  const next = nx && !nx.b && roomOf(nx)!==roomOf(c) ? `<div class="next">Next: <b>${esc(roomOf(nx))}</b></div>` : "";
  if (!c) return `<div class="tile"><div class="strip"></div><div class="in"><div class="sec">${sec}</div><div class="room">—</div></div></div>`;
  if (c.b) return `<div class="tile pause"><div class="strip"></div><div class="in"><div class="sec">${sec}</div><div class="room">${esc(c.b)}</div><div class="meta"><span class="who">${nx&&!nx.b?`Then: ${esc(nx.o?"Electives":nx.s)} · ${esc(roomOf(nx))}`:""}</span></div></div></div>`;
  if (c.o) return `<div class="tile"><div class="strip" style="--c:var(--muted)"></div><div class="in"><div class="opts" style="--n:${c.o.length}">${c.o.map(o=>`<div class="opt" style="--c:${o.c}"><div class="r">${esc(o.r)}</div><div class="s">${esc(o.s)} · ${esc(o.t)}</div></div>`).join("")}</div></div>${next}</div>`;
  return `<div class="tile"><div class="strip" style="--c:${c.c}"></div><div class="in"><div class="sec">${sec}</div><div class="room">${esc(c.r||"—")}</div><div class="meta"><span class="subj">${esc(c.s)}</span><span class="who">${esc(c.t)}</span></div></div>${next}</div>`;
}

const $ = id => document.getElementById(id);
function render(){
  const now = new Date(), st = state(now);
  $("clock").textContent = now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  $("date").textContent = now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const chip = $("chip");
  if (st.mode==="end"){
    $("cycle").textContent = "—"; $("slotK").textContent = ""; $("slotV").textContent = "";
    chip.className = "chip off"; chip.textContent = st.label; $("prog").style.width = "0"; $("board").innerHTML = ""; return;
  }
  const day = st.day, p = st.p;
  const off = st.mode==="off";
  $("cycle").className = "cycle" + (off ? " off" : "");
  $("cycle").textContent = off ? st.today : `DAY ${day}`;
  $("slotK").textContent = off ? `Showing ${long(st.date)} · DAY ${day}` : `Period ${p+1}`;
  $("slotV").textContent = off ? `Period ${p+1} · ${fmt(P[p][0])} – ${fmt(P[p][1])}` : `${fmt(P[p][0])} – ${fmt(P[p][1])}`;
  const isBreak = DATA["6A"][day-1][p]?.b;
  chip.className = "chip" + (isBreak && st.mode!=="off" ? " brk" : "") + (st.mode==="off" ? " off" : "");
  chip.textContent = st.mode==="now" ? (isBreak ? isBreak : "Now") : off ? st.why : st.label;
  $("prog").style.width = st.mode==="now" ? (st.frac*100).toFixed(1)+"%" : "0";

  let h = `<div></div>` + SECS.map(s=>`<div class="colh">${s}</div>`).join("");
  for (const g of GRADES){
    h += `<div class="grade">${g}<sup>°</sup></div>`;
    for (const s of SECS){
      const d = DATA[g+s][day-1];
      h += tileHTML(s, d[p], d[p]?.b ? d[p+1] : (p+1<P.length ? d[p+1] : null));
    }
  }
  $("board").innerHTML = h;
}

$("fs").onclick = ()=>{ const el=document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(()=>{}); };
document.addEventListener("keydown", e=>{ if (e.key.toLowerCase()==="f") $("fs").click(); });
// Se recarga sola cada madrugada (4 a. m.) para arrancar el día limpia
const bootDay = ymd(new Date());
setInterval(()=>{ const n=new Date(); if (ymd(n)!==bootDay && n.getHours()>=4) location.reload(); }, 600000);
try{ navigator.wakeLock?.request("screen").catch(()=>{}); }catch(e){}
render(); setInterval(render, 5000);
</script>
